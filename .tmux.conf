# Old 
# set -g mouse on


##### General ergonomics #####

# Start windows/panes at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Faster key sequences
set -sg escape-time 10

# More scrollback
set -g history-limit 50000

# True color
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Keep window titles stable rather than letting programs rename them
set -g allow-rename off

##### Prefix #####

# # Ctrl-a is much easier than Ctrl-b
# unbind C-b
# set -g prefix C-a
# bind C-a send-prefix

# Reload config
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

##### Windows / panes #####

# Intuitive splitting
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New windows inherit current directory
bind c new-window -c "#{pane_current_path}"

# Vim-style pane movement
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# # Resize panes without repeatedly pressing prefix
# bind -r H resize-pane -L 5
# bind -r J resize-pane -D 5
# bind -r K resize-pane -U 5
# bind -r L resize-pane -R 5

# Quickly jump to previous window
bind Space last-window

##### Mouse #####

set -g mouse on

##### Copy mode #####

setw -g mode-keys vi

# Enter copy mode
bind [ copy-mode

# vi-ish selection
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

##### macOS clipboard #####

# Copy tmux selection directly into macOS clipboard
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

##### Status line #####

set -g status-position bottom
set -g status-interval 5

set -g status-left-length 30
set -g status-left '#[bold] #S '

set -g status-right-length 80
set -g status-right '#{pane_current_path}  %H:%M '

setw -g window-status-format ' #I:#W '
setw -g window-status-current-format '#[bold] #I:#W* '

##### Quality of life #####

# Don't wait forever for confirmation messages
set -g display-time 1500

# Keep sessions alive if tmux server is running
set -g detach-on-destroy off

# Hide the pane-title row until a window is split
set -g pane-border-status off
set -g pane-border-format ' #{pane_index}: #{pane_current_command} '

# Theme
# --- Blue tmux theme centered on #448FDA ---

# Main status bar
set -g status-style "bg=#448FDA,fg=#F7FAFC" 

# Session name
set -g status-left "#[bg=#2F6FA8,fg=#F7FAFC,bold] #S #[bg=#448FDA,fg=#F7FAFC] "
set -g status-left-length 40

# Right side
set -g status-right-length 100
set -g status-right "#[fg=#DCEBFA]#{pane_current_path}  #[fg=#F7FAFC,bold]%H:%M "

# Inactive windows
setw -g window-status-style "bg=#448FDA,fg=#AFD7FF"
setw -g window-status-format " #I:#W "

# Active/current window
# tmux expands #D in style options as a format shortcut, so keep the
# escaped true-color values in the format string itself.
setw -g window-status-current-style "default"
setw -g window-status-current-format "#[bg=##DCEBFA,fg=##17324D,bold] #I:#W #[bg=##448FDA,fg=##F7FAFC,nobold]"

# Pane borders
set -g pane-border-style "fg=#285F8F"
set -g pane-active-border-style "fg=#448FDA"

# Pane title
# Show the title row only while this window has multiple panes.
set-hook -g window-layout-changed[50] 'if-shell -F "#{==:#{window_panes},1}" "set-option -w pane-border-status off" "set-option -w pane-border-status top"'
# Match the current window's Ice reverse palette on the active pane title.
# set -g pane-border-format "#{?pane_active,#[bg=##DCEBFA]#[fg=##17324D]#[bold],#[bg=default]#[fg=#87AFD7]} #{pane_index}: #{pane_current_command} #[default]"
set -g pane-border-format "#{?pane_active,#[bg=##448FDA]#[fg=##DCEBFA]#[bold],#[bg=default]#[fg=#87AFD7]} #{pane_index}: #{?#{pane_title},#{pane_title},#{pane_current_command}} #[default]"

# tmux messages / command prompt
set -g message-style "bg=#17324D,fg=#F7FAFC"
set -g message-command-style "bg=#17324D,fg=#C7DDF2"

# Copy mode / selection
setw -g mode-style "bg=#2F6FA8,fg=#F7FAFC"
